name: book-ch17
services:
  db:
    image: book-ch17-db:16.4
    build:
      context: ../..
      dockerfile: examples/ch17-backup-restore/db/Dockerfile
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookuser}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: ${POSTGRES_DB:-bookdb}
    secrets:
      - db_password
    ports:
      - "127.0.0.1:5437:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

secrets:
  db_password:
    file: ${CH17_DB_SECRET_FILE:?set CH17_DB_SECRET_FILE to a local file outside the repository}
