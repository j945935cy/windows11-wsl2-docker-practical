services:
  web:
    build:
      context: .
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2)"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 2s

  checker:
    image: python:3.12-slim
    profiles: ["verify"]
    depends_on:
      web:
        condition: service_healthy
    command: ["python", "-c", "import urllib.request; print(urllib.request.urlopen('http://web:8000/', timeout=3).status)"]
